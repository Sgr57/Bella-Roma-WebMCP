<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mockup personalizzazione — A / B / C</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          "coffee-dark": "#163052",
          "coffee-mid": "#343E52",
          "coffee-cream": "#FEF1DF",
          "coffee-accent": "#FF8700",
          "lavazza-deep": "#051432",
          "lavazza-off": "#FFFBF8",
          "lavazza-soft": "#F4FBFF",
          "lavazza-line": "#E6E9EF",
        },
        borderRadius: { pill: "30px" },
        boxShadow: {
          lavazza: "0 0 6px rgba(2,20,35,0.08)",
          "lavazza-md": "0 2px 12px rgba(2,20,35,0.10)",
          "lavazza-lg": "0 12px 40px rgba(2,20,35,0.18)",
        },
      },
    },
  };
</script>
<style>
  body { background: #FFFBF8; font-family: Inter, system-ui, sans-serif; }
  .card-flip-front, .card-flip-back {
    backface-visibility: hidden;
    transition: opacity .35s ease, transform .35s ease;
  }
  .card-flip-back { position: absolute; inset: 1rem; opacity: 0; transform: rotateY(8deg); pointer-events: none; }
  .card.is-open .card-flip-front { opacity: 0; transform: rotateY(-8deg); pointer-events: none; }
  .card.is-open .card-flip-back  { opacity: 1; transform: rotateY(0); pointer-events: auto; }

  .chip { border: 1px solid #E6E9EF; background: white; color: #343E52; padding: 6px 14px; border-radius: 30px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; cursor: pointer; transition: all .15s; }
  .chip.is-active { background: #163052; color: white; border-color: #163052; }
  .chip:hover:not(.is-active) { border-color: #163052; }
  .tile { border: 1px solid #E6E9EF; background: white; padding: 10px 8px; border-radius: 8px; text-align: center; cursor: pointer; transition: all .15s; }
  .tile.is-active { border-color: #163052; background: #F4FBFF; box-shadow: 0 0 0 2px rgba(22,48,82,.15); }
  .tile:hover:not(.is-active) { border-color: #163052; }
  .tile .emoji { font-size: 22px; display: block; line-height: 1; }
  .tile .name { font-size: 10px; color: #343E52; margin-top: 4px; text-transform: uppercase; letter-spacing: .06em; }
  .tile .delta { font-size: 9px; color: #FF8700; margin-top: 1px; font-weight: 600; }

  /* shared backdrop (B + C) — leggero blur per B */
  .backdrop { position: fixed; inset: 0; background: rgba(5,20,50,.28); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 30; }
  .backdrop.is-open { opacity: 1; pointer-events: auto; }

  /* B - popover ancorato a destra della card */
  .popover { position: absolute; z-index: 40; width: 340px; background: white; border-radius: 14px; box-shadow: 0 24px 60px rgba(2,20,35,.25); padding: 20px; opacity: 0; transform: translateX(-8px) scale(.97); pointer-events: none; transition: opacity .2s, transform .2s; }
  .popover.is-open { opacity: 1; transform: translateX(0) scale(1); pointer-events: auto; }
  .card.is-lifted { transform: scale(1.04); box-shadow: 0 16px 40px rgba(2,20,35,.18); z-index: 35; position: relative; }

  /* C - bottom sheet */
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; background: white; border-radius: 24px 24px 0 0; box-shadow: 0 -16px 50px rgba(2,20,35,.18); transform: translateY(100%); transition: transform .35s cubic-bezier(.2,.8,.2,1); padding: 24px 28px 32px; max-width: 720px; margin: 0 auto; }
  .sheet.is-open { transform: translateY(0); }
  .sheet-handle { width: 44px; height: 4px; background: #E6E9EF; border-radius: 2px; margin: 0 auto 18px; }

  /* shared customizer */
  .customizer h4 { font-size: 11px; text-transform: uppercase; letter-spacing: .15em; color: #343E52; margin-bottom: 8px; font-weight: 500; }
  .customizer .row { margin-bottom: 14px; }
  .customizer .actions { display: flex; gap: 8px; margin-top: 4px; }

  /* generic */
  .card { background: #FFFBF8; border-radius: 12px; padding: 16px; position: relative; transition: transform .25s, box-shadow .25s; cursor: pointer; }
  .card:hover { box-shadow: 0 0 6px rgba(2,20,35,.08); }
  .card.non-customizable { cursor: pointer; }
  .badge-customizable { position: absolute; top: 10px; right: 10px; display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 30px; background: rgba(255,135,0,.12); color: #FF8700; font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; }
  .intensity-bars { display: inline-flex; gap: 2px; }
  .intensity-bars span { width: 5px; height: 8px; background: #E6E9EF; border-radius: 1px; }
  .intensity-bars span.on { background: #163052; }

  .pulse {
    animation: pulse-glow .55s ease;
  }
  @keyframes pulse-glow {
    0% { transform: scale(1); box-shadow: 0 0 0 rgba(255,135,0,0); }
    50% { transform: scale(1.03); box-shadow: 0 0 28px rgba(255,135,0,.55); }
    100% { transform: scale(1); box-shadow: 0 0 0 rgba(255,135,0,0); }
  }
</style>
</head>
<body class="text-coffee-mid">

<!-- HEADER -->
<header class="bg-white border-b border-lavazza-line">
  <div class="max-w-5xl mx-auto px-6 py-5 flex items-center justify-between">
    <div>
      <p class="text-[10px] uppercase tracking-[0.25em] text-coffee-mid">Mockup interattivo</p>
      <h1 class="font-display text-2xl font-bold text-lavazza-deep">Personalizzazione prodotti — 3 scenari</h1>
    </div>
    <p class="text-xs text-coffee-mid max-w-xs text-right">Clicca su una card "Personalizzabile" per provare. La brioche non lo è (click = aggiunta diretta).</p>
  </div>

  <!-- Mode toggle -->
  <div class="max-w-5xl mx-auto px-6 pb-5 flex gap-2 flex-wrap">
    <button data-mode="A" class="mode-btn chip is-active">A · Trasformazione in-place</button>
    <button data-mode="B" class="mode-btn chip">B · Popover ancorato</button>
    <button data-mode="C" class="mode-btn chip">C · Bottom sheet</button>
  </div>

  <!-- Mode description -->
  <div class="max-w-5xl mx-auto px-6 pb-5">
    <div id="mode-desc" class="bg-lavazza-soft border border-lavazza-line rounded-lg p-4 text-sm leading-relaxed"></div>
  </div>
</header>

<!-- PRODUCT GRID + RIGHT CART COLUMN -->
<main class="max-w-7xl mx-auto px-6 py-10">
  <div class="grid grid-cols-1 lg:grid-cols-[1fr_340px] gap-6">
    <div>
      <div id="grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5"></div>
    </div>

    <aside>
      <div class="bg-white border border-lavazza-line rounded-md p-5 sticky top-4">
        <div class="flex items-center justify-between mb-4">
          <h3 class="font-display text-lg font-bold text-lavazza-deep">Carrello</h3>
          <span class="text-xs text-coffee-mid">1 articolo</span>
        </div>
        <div class="flex items-center gap-3 pb-3 border-b border-lavazza-line">
          <span class="text-3xl">☕</span>
          <div class="flex-1">
            <p class="font-medium text-sm text-lavazza-deep leading-tight">Cappuccino</p>
            <p class="text-[11px] text-coffee-mid mt-0.5">M · latte intero · normale</p>
          </div>
          <p class="text-sm font-semibold text-lavazza-deep">€ 2,50</p>
        </div>
        <div class="flex items-center justify-between mt-4 mb-4">
          <span class="text-sm text-coffee-mid">Totale</span>
          <span class="font-display text-xl font-bold text-lavazza-deep">€ 2,50</span>
        </div>
        <button class="w-full bg-coffee-accent text-white py-3 rounded-pill text-xs uppercase tracking-[0.12em] font-semibold hover:brightness-110 transition">
          Vai al checkout
        </button>
        <p class="text-[10px] text-coffee-mid text-center mt-3 italic">finto carrello, solo per contesto</p>
      </div>
    </aside>
  </div>
</main>

<!-- B: backdrop + popover host -->
<div id="backdrop" class="backdrop"></div>
<div id="popover-host"></div>

<!-- C: bottom sheet -->
<div id="sheet" class="sheet">
  <div class="sheet-handle"></div>
  <div id="sheet-body"></div>
</div>

<script>
const PRODUCTS = [
  { id: 'cappuccino', name: 'Cappuccino', emoji: '☕', price: 2.50, intensity: 6, desc: 'Espresso e latte montato in equilibrio classico.',
    options: { size: ['S','M','L'], milk: ['whole','oat','almond','coconut'], sweetness: ['none','low','normal'] },
    defaults: { size: 'M', milk: 'whole', sweetness: 'normal' } },
  { id: 'espresso', name: 'Espresso', emoji: '☕', price: 1.20, intensity: 9, desc: 'Estrazione a 25 secondi. Note di cacao e nocciola.',
    options: { sweetness: ['none','low','normal'] },
    defaults: { sweetness: 'normal' } },
  { id: 'brioche', name: 'Brioche vuota', emoji: '🥐', price: 1.80, intensity: null, desc: 'Soffice, alla maniera milanese.',
    options: {}, defaults: {} },
];

const MILK = {
  whole:   { emoji: '🥛', name: 'Intero',   delta: 0 },
  oat:     { emoji: '🌾', name: 'Avena',    delta: 0.30 },
  almond:  { emoji: '🌰', name: 'Mandorla', delta: 0.40 },
  coconut: { emoji: '🥥', name: 'Cocco',    delta: 0.30 },
};
const SIZE_DELTA = { S: -0.20, M: 0, L: 0.40 };
const SWEET_LABEL = { none: 'Senza', low: 'Poco', normal: 'Normale' };

let mode = 'A';
let state = {}; // per-product selections
PRODUCTS.forEach(p => state[p.id] = { ...p.defaults });

const MODE_DESC = {
  A: '<strong>A — Trasformazione in-place.</strong> Clicchi la card e il suo contenuto cambia: la vista prodotto sfuma ed entra la personalizzazione, mantenendo la stessa identica dimensione. La griglia non si muove di un pixel.',
  B: '<strong>B — Popover ancorato a destra della card.</strong> La card cliccata si solleva e il resto della pagina sfuma dietro un backdrop leggermente blurrato. Il pannello di personalizzazione appare al fianco destro della card (con fallback a sinistra se la card è sull\'ultima colonna). <em>Su mobile useremo il bottom sheet (scenario C).</em>',
  C: '<strong>C — Bottom sheet.</strong> Un cassetto sale dal basso della finestra, occupando l\'area inferiore. Tantissimo spazio, esperienza decisamente modale.',
};

const isCustomizable = (p) => Object.keys(p.options).length > 0;

function computePrice(p) {
  let price = p.price;
  const sel = state[p.id];
  if (p.options.size && sel.size) price += SIZE_DELTA[sel.size] ?? 0;
  if (p.options.milk && sel.milk) price += MILK[sel.milk]?.delta ?? 0;
  return price;
}

function renderCustomizer(p, compact = false) {
  const sel = state[p.id];
  const price = computePrice(p);
  let html = `<div class="customizer">
    <div class="flex items-start justify-between mb-3">
      <div>
        <p class="text-[10px] uppercase tracking-[0.2em] text-coffee-mid">Personalizza</p>
        <h3 class="font-display ${compact ? 'text-base' : 'text-lg'} font-bold text-lavazza-deep leading-tight">${p.name}</h3>
      </div>
      <button data-action="close" class="text-coffee-mid hover:text-lavazza-deep text-lg leading-none">✕</button>
    </div>`;

  if (p.options.size) {
    html += `<div class="row">
      <h4>Taglia</h4>
      <div class="flex gap-2">
        ${p.options.size.map(s => `<button data-opt="size" data-val="${s}" class="chip ${sel.size===s?'is-active':''}">${s}</button>`).join('')}
      </div></div>`;
  }
  if (p.options.milk) {
    html += `<div class="row">
      <h4>Latte</h4>
      <div class="grid ${compact ? 'grid-cols-2 gap-1.5' : 'grid-cols-4 gap-2'}">
        ${p.options.milk.map(m => `<button data-opt="milk" data-val="${m}" class="tile ${sel.milk===m?'is-active':''}">
          <span class="emoji">${MILK[m].emoji}</span>
          <span class="name">${MILK[m].name}</span>
          ${MILK[m].delta>0 ? `<span class="delta">+€${MILK[m].delta.toFixed(2)}</span>` : `<span class="delta" style="color:#A0A4AD">incluso</span>`}
        </button>`).join('')}
      </div></div>`;
  }
  if (p.options.sweetness) {
    html += `<div class="row">
      <h4>Zucchero</h4>
      <div class="flex gap-2 flex-wrap">
        ${p.options.sweetness.map(s => `<button data-opt="sweetness" data-val="${s}" class="chip ${sel.sweetness===s?'is-active':''}">${SWEET_LABEL[s]}</button>`).join('')}
      </div></div>`;
  }
  html += `<div class="actions mt-4">
    <button data-action="add" class="flex-1 bg-coffee-dark text-white py-3 rounded-pill text-xs uppercase tracking-[0.12em] font-semibold hover:bg-lavazza-deep transition">
      Aggiungi · € ${price.toFixed(2).replace('.', ',')}
    </button>
  </div>`;
  html += '</div>';
  return html;
}

function renderProductView(p) {
  const intensity = p.intensity;
  const bars = intensity != null ? Array.from({length:10}).map((_,i)=>`<span class="${i<intensity?'on':''}"></span>`).join('') : '';
  return `
    <div class="card-flip-front flex flex-col">
      ${isCustomizable(p) ? '<span class="badge-customizable">◐ Personalizzabile</span>' : ''}
      <div class="h-28 flex items-center justify-center mb-2">
        <span class="text-6xl">${p.emoji}</span>
      </div>
      <h3 class="font-display text-base font-bold text-lavazza-deep text-center leading-tight mb-1">${p.name}</h3>
      ${intensity!=null?`<div class="flex items-center justify-center gap-2 mb-2"><span class="text-[10px] text-coffee-mid">Intensità</span><div class="intensity-bars">${bars}</div></div>`:''}
      <p class="text-[11px] text-coffee-mid text-center px-1 mb-3 leading-relaxed">${p.desc}</p>
      <p class="text-lg font-bold text-coffee-mid text-center">€ ${p.price.toFixed(2).replace('.', ',')}</p>
    </div>`;
}

function renderGrid() {
  const grid = document.getElementById('grid');
  grid.innerHTML = PRODUCTS.map(p => `
    <div class="card ${!isCustomizable(p)?'non-customizable':''}" data-product="${p.id}">
      ${renderProductView(p)}
      <div class="card-flip-back bg-white border border-lavazza-line rounded-md p-4 overflow-hidden"></div>
    </div>
  `).join('');
  attachCardListeners();
}

function attachCardListeners() {
  document.querySelectorAll('.card').forEach(card => {
    card.addEventListener('click', (e) => {
      // ignore clicks coming from open customizer inner controls
      if (e.target.closest('.card-flip-back')) return;
      const id = card.dataset.product;
      const p = PRODUCTS.find(x => x.id === id);
      if (!isCustomizable(p)) {
        return doAdd(p, card);
      }
      openCustomizer(p, card);
    });
  });
}

function openCustomizer(p, cardEl) {
  if (mode === 'A') openModeA(p, cardEl);
  if (mode === 'B') openModeB(p, cardEl);
  if (mode === 'C') openModeC(p, cardEl);
}

// ===== Mode A — in place =====
function openModeA(p, cardEl) {
  closeAll();
  const back = cardEl.querySelector('.card-flip-back');
  back.innerHTML = renderCustomizer(p, true);
  cardEl.classList.add('is-open');
  attachCustomizerListeners(back, p, cardEl);
}
function closeModeA(cardEl) {
  cardEl.classList.remove('is-open');
}

// ===== Mode B — popover ancorato a destra della card =====
function openModeB(p, cardEl) {
  closeAll();
  const rect = cardEl.getBoundingClientRect();
  const popover = document.createElement('div');
  popover.className = 'popover';
  popover.innerHTML = renderCustomizer(p, true);
  document.getElementById('popover-host').appendChild(popover);

  const POP_W = 340;
  const GAP = 16;
  const spaceRight = window.innerWidth - rect.right;
  let left;
  if (spaceRight > POP_W + GAP + 12) {
    // a destra della card
    left = rect.right + window.scrollX + GAP;
  } else {
    // fallback a sinistra
    left = rect.left + window.scrollX - POP_W - GAP;
    if (left < 12) left = 12;
  }
  // verticalmente: allinea il top alla card, ma evita overflow inferiore
  let top = rect.top + window.scrollY;
  // approssima un'altezza ragionevole del popover
  const popHEstimate = 420;
  const bottomOverflow = (top - window.scrollY) + popHEstimate - window.innerHeight;
  if (bottomOverflow > 0) top -= bottomOverflow + 12;

  popover.style.top = top + 'px';
  popover.style.left = left + 'px';
  cardEl.classList.add('is-lifted');
  document.getElementById('backdrop').classList.add('is-open');
  requestAnimationFrame(() => popover.classList.add('is-open'));
  attachCustomizerListeners(popover, p, cardEl, 'B');
}
function closeModeB() {
  document.getElementById('backdrop').classList.remove('is-open');
  const host = document.getElementById('popover-host');
  Array.from(host.children).forEach(el => {
    el.classList.remove('is-open');
    setTimeout(() => el.remove(), 200);
  });
  document.querySelectorAll('.card.is-lifted').forEach(c => c.classList.remove('is-lifted'));
}

// ===== Mode C — bottom sheet =====
function openModeC(p, cardEl) {
  closeAll();
  const body = document.getElementById('sheet-body');
  body.innerHTML = renderCustomizer(p, false);
  const sheet = document.getElementById('sheet');
  document.getElementById('backdrop').classList.add('is-open');
  requestAnimationFrame(() => sheet.classList.add('is-open'));
  attachCustomizerListeners(sheet, p, cardEl, 'C');
}
function closeModeC() {
  document.getElementById('sheet').classList.remove('is-open');
  document.getElementById('backdrop').classList.remove('is-open');
}

function closeAll() {
  document.querySelectorAll('.card.is-open').forEach(c => c.classList.remove('is-open'));
  closeModeB();
  closeModeC();
}

function attachCustomizerListeners(root, p, cardEl, currentMode) {
  root.querySelectorAll('[data-opt]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const opt = btn.dataset.opt, val = btn.dataset.val;
      state[p.id][opt] = val;
      // re-render in place
      if (root.id === 'sheet') {
        document.getElementById('sheet-body').innerHTML = renderCustomizer(p, false);
        attachCustomizerListeners(document.getElementById('sheet'), p, cardEl, 'C');
      } else if (root.classList.contains('popover')) {
        root.innerHTML = renderCustomizer(p, true);
        attachCustomizerListeners(root, p, cardEl, 'B');
      } else {
        root.innerHTML = renderCustomizer(p, true);
        attachCustomizerListeners(root, p, cardEl, 'A');
      }
    });
  });
  root.querySelectorAll('[data-action="close"]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      closeAll();
    });
  });
  root.querySelectorAll('[data-action="add"]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      closeAll();
      doAdd(p, cardEl);
    });
  });
}

function doAdd(p, cardEl) {
  // reset selection to defaults
  state[p.id] = { ...p.defaults };
  // pulse animation
  cardEl.classList.remove('pulse');
  void cardEl.offsetWidth;
  cardEl.classList.add('pulse');
  // briefly flash a toast
  showToast(`Aggiunto al carrello: ${p.name}`);
}

function showToast(msg) {
  let toast = document.getElementById('toast');
  if (!toast) {
    toast = document.createElement('div');
    toast.id = 'toast';
    toast.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#051432;color:white;padding:10px 18px;border-radius:30px;font-size:12px;z-index:100;box-shadow:0 8px 24px rgba(2,20,35,.3);opacity:0;transition:opacity .25s';
    document.body.appendChild(toast);
  }
  toast.textContent = msg;
  toast.style.opacity = '1';
  clearTimeout(toast._t);
  toast._t = setTimeout(() => toast.style.opacity = '0', 1600);
}

// Backdrop click closes
document.getElementById('backdrop').addEventListener('click', closeAll);
// Esc closes
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeAll(); });
// Mode toggle
document.querySelectorAll('.mode-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    closeAll();
    mode = btn.dataset.mode;
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.toggle('is-active', b.dataset.mode === mode));
    document.getElementById('mode-desc').innerHTML = MODE_DESC[mode];
  });
});

// Init
document.getElementById('mode-desc').innerHTML = MODE_DESC[mode];
renderGrid();
</script>
</body>
</html>
